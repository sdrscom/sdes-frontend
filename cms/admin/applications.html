<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SDES CMS | Applications</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app-nav"></div>

  <div class="container">
    <h1>Applications</h1>
    <p class="subtitle">Candidates who applied through the public Careers page.</p>

    <div class="card">
      <table>
        <thead>
          <tr><th>Name</th><th>Applied for</th><th>Contact</th><th>Resume</th><th>Received</th><th></th></tr>
        </thead>
        <tbody id="app-rows"></tbody>
      </table>
      <p class="empty-msg" id="empty-msg" style="display:none;">No applications yet.</p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    let items = [];

    async function loadApplications() {
      const res = await apiFetch('/admin/api/applications');
      const data = await res.json();
      items = data.data;
      renderRows();
    }

    function renderRows() {
      const tbody = document.getElementById('app-rows');
      document.getElementById('empty-msg').style.display = items.length ? 'none' : 'block';
      tbody.innerHTML = items
        .map(
          (item) => `
        <tr>
          <td>${escapeHtml(item.first_name || '')} ${escapeHtml(item.last_name || '')}</td>
          <td>${escapeHtml(item.job_title || '—')}</td>
          <td>
            ${item.email ? `<div>${escapeHtml(item.email)}</div>` : ''}
            ${item.phone ? `<div>${escapeHtml(item.phone)}</div>` : ''}
          </td>
          <td>${item.resume_url ? `<a href="${escapeHtml(item.resume_url)}" target="_blank" rel="noopener">View</a>` : '—'}</td>
          <td>${item.created_at ? new Date(item.created_at).toLocaleDateString() : ''}</td>
          <td class="actions-cell">
            <button class="btn btn-sm btn-danger" onclick="deleteItem(${item.id})">Delete</button>
          </td>
        </tr>`
        )
        .join('');
    }

    async function deleteItem(id) {
      if (!confirm('Delete this application?')) return;
      await apiFetch(`/admin/api/applications/${id}`, { method: 'DELETE' });
      showToast('Application deleted');
      loadApplications();
    }

    (async () => {
      const user = await requireSession();
      if (user) {
        renderNav('/applications.html');
        loadApplications();
      }
    })();
  </script>
</body>
</html>
